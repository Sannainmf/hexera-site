# Deploy hexera.so on every push to main.
#
# Why a workflow instead of Vercel's native Git integration: this repo is
# private AND owned by an organisation, which Vercel's Hobby plan refuses to
# connect. The CLI uploads the build directly and never touches that
# integration, so it works on Hobby. Deploys target the existing project by
# VERCEL_PROJECT_ID, which is what keeps the hexera.so domain attached.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       account token, Vercel -> Account Settings -> Tokens
#   VERCEL_ORG_ID      Vercel -> Account/Team Settings -> General
#   VERCEL_PROJECT_ID  the EXISTING hexera.so project -> Settings -> General
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-deploy by hand from the Actions tab

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency: # a newer push supersedes an in-flight deploy
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
